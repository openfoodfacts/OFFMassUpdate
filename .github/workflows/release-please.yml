 name: Run release-please
 on:
   push:
     branches:
       - main
 jobs:
   release-please:
     permissions:
       contents: write
       pull-requests: write
     runs-on: ubuntu-latest
     steps:
       - uses: googleapis/release-please-action@v5.0.0
         with:
           token: ${{ secrets.GITHUB_TOKEN }}
           release-type: simple
